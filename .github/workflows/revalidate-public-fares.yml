name: Recheck Public Fares

on:
  workflow_dispatch:

concurrency:
  group: public-fare-renewal
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Recheck expiring public itineraries
        run: uv run luxflight-scan --revalidate-public-fares --json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCANNER_CURRENCY: ${{ secrets.SCANNER_CURRENCY }}
          PUBLIC_CACHE_REVALIDATION_URL: https://www.352flights.com/api/public-deals/revalidate
